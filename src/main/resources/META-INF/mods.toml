[[mods]]
modId="epicfightnanafreezefix"
version="1.0.0"
displayName="EpicFight NaN Freeze Fix"
authors="LMaxRouterCN"
description='''
Fixes the Epic Fight client hard-freeze (MC 1.20.1, Epic Fight 20.14.x):
a zero-length looping animation makes AnimationPlayer.tick compute
elapsedTime %= 0.0F, producing NaN that poisons ConcurrentLinkAnimation
startsAt and drives the render thread into a never-terminating binary
search inside AnimationClip.getPoseInTime. Root cause analysis:
https://github.com/Antikythera-Studios/epicfight/issues/2625
'''

[[dependencies.epicfightnanafreezefix]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="BOTH"

[[dependencies.epicfightnanafreezefix]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.21)"
ordering="NONE"
side="BOTH"

